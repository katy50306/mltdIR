				labels: {

					const minutes = duration.minutes().toString().padStart(2, '0')

			height:'500px',

			autoColumnsDefinitions: function(definitions) {

						col.formatter = function(cell) {
							const val = cell.getValue()
							return val != null ? val.toLocaleString() : ''

		$('#update').on('click', async ()=>{
			try{

				//取值
				const eventId = $('#eventId').val()
				const idolId = $('#idolId').val()
				const rank = $('#rank').val() * 1

				//檢查是否都填了
				let msg='';

				if(eventId.length === 0) msg+='<p>活動未選</p>'
				if(idolId === null) msg+='<p>偶像未選</p>'
				if(!Number.isInteger(rank) || rank < 1 || rank > 1000) msg+='<p>名次未填、超出範圍或非數字</p>'

				if(msg.length>0) throw msg

				//告知使用者更新中
				$('#msg').text('更新中')
				$('#myModal').modal('show')

				//儲存變數，下次進入時代入
				localStorage.setItem("eventIdY", JSON.stringify(eventId))
				localStorage.setItem("idolIdY", idolId)
				localStorage.setItem("rankY", rank)

				//抓資料
				const data = await fetchData(eventId, idolId, rank)

				//畫圖
				draw(data)

				//設定表格
				setTable(data)

				$(".data").attr('disabled', false)
				$('#err').hide()

			} catch(e){
				$('#err').html(e).show()
			} finally {
				$('#myModal').modal('hide')
			}
		})

		async function fetchData(eventIds, idolId, rank) {
			// 平行發出所有請求
			const promises = eventIds.map(eventId => {
				const url = "https://api.matsurihi.me/api/mltd/v2/events/" + eventId + "/rankings/idolPoint/" + idolId + "/logs/" + rank + '?prettyPrint=false'

				return $.ajax({ dataType: "json", url: url })
					.then(d => {
						// 找出活動的名稱跟開始時間
						const evt = $.grep(eventList, (item) => item.id == eventId)
						const evtbt = dayjs(evt[0].bt)

						// 處理資料：過濾 30 分鐘間隔並計算相對時間
						const data = d[0].data
							.filter(x => dayjs(x.aggregatedAt).minute() % 30 === 0)
							.map(x => [dayjs.duration(dayjs(x.aggregatedAt).diff(evtbt)).valueOf(), x.score])
						return { name: evt[0].text, data: data }
					})
					.catch(() => {
						$('#err').html('抓資料發生錯誤，請稍後再試。若重複出現請連同查詢條件開github issue').show()
						return null
					})
			})

			const results = await Promise.all(promises)
			return results.filter(r => r !== null)
		}


		function draw(data){

			//清舊資料
			while (chart.series.length > 0) {
				chart.series[0].remove();
			}

			//加新資料
			for (let i = 0; i < data.length; i++){
				chart.addSeries({
					lineWidth: 3,
					name: data[i].name,
					data: data[i].data
				}, false)
			}
			chart.redraw()
		}


		function setTable(data){
			// 找出所有時間點的聯集（以相對時間為 key）
			const timeSet = new Set()
			data.forEach(series => {
				series.data.forEach(point => {
					timeSet.add(point[0])
				})
			})
			const times = Array.from(timeSet).sort((a, b) => a - b)

			// 建立每個系列的時間→分數對照表
			const scoreMap = data.map(series => {
				const map = {}
				series.data.forEach(point => {
					map[point[0]] = point[1]
				})
				return map
			})

			// 組合表格資料
			const tData = times.map(time => {
				const duration = dayjs.duration(time)
				const days = Math.floor(duration.asDays()) + 1
				const hours = duration.hours().toString().padStart(2, '0')
				const minutes = duration.minutes().toString().padStart(2, '0')
				const timeStr = 'Day ' + days + ' ' + hours + ':' + minutes

				const row = { time: timeStr }
				data.forEach((series, idx) => {
					row[series.name] = scoreMap[idx][time] ?? null
				})
				return row
			})

			// 保存原始資料
			originalTableData = JSON.parse(JSON.stringify(tData))
			originalColumns = ['time', ...data.map(s => s.name)]
			diffState = { columnDiff: false, rowDiff: false, order: [] }

			table.setData(tData)
		}


		function columnDiff() {
			// 不同活動差異
			if (!originalTableData) return

			if (!diffState.columnDiff) {
				diffState.columnDiff = true
				diffState.order.push('column')
			}
			rebuildTable()
		}

		function rowDiff() {
			// 同活動差異
			if (!originalTableData) return

			if (!diffState.rowDiff) {
				diffState.rowDiff = true
				diffState.order.push('row')
			}
			rebuildTable()
		}

		function resetDiff() {
			// 重置到原始資料
			if (!originalTableData) return

			diffState = { columnDiff: false, rowDiff: false, order: [] }
			table.setData(JSON.parse(JSON.stringify(originalTableData)))
		}

		function rebuildTable() {
			// 根據狀態重建表格
			const ds = JSON.parse(JSON.stringify(originalTableData))
			const cols = originalColumns

			const result = ds.map((row, idx) => {
				let newRow = {}

				// 原始資料
				cols.forEach(col => {
					newRow[col] = row[col]
				})

				// 依點擊順序加入差異欄位
				diffState.order.forEach(type => {
					if (type === 'column') {
						// 不同活動差異（相鄰活動）
						for (let i = 1; i < cols.length - 1; i++) {
							const diffKey = cols[i] + '-' + cols[i + 1]
							const val1 = row[cols[i]]
							const val2 = row[cols[i + 1]]
							newRow[diffKey] = (val1 !== null && val2 !== null) ? val1 - val2 : null
						}
					} else if (type === 'row') {
						// 同活動差異（與前一時間點）
						for (let i = 1; i < cols.length; i++) {
							const diffKey = 'Δ' + cols[i]
							const curr = row[cols[i]]
							const prev = idx === 0 ? null : originalTableData[idx - 1][cols[i]]
							newRow[diffKey] = (curr !== null && prev !== null) ? curr - prev : (idx === 0 ? 0 : null)
						}
					}
				})

				return newRow
			})

			table.setData(result)
		}

		async function eventListRenew() {
			// 更新活動清單，並存到 localStorage 中
			$('#msg').text('更新中')

					dataType: 'json'

				let r = []
				for (let i = 0; i < ev.length; i++) {
					r.push({id: ev[i].id, text: ev[i].name, bt: ev[i].schedule.beginAt, et: ev[i].schedule.endAt})
				}
				localStorage.setItem("eventList", JSON.stringify(r))
				eventList = r
				$("#eventId").html('').select2({data: eventList, multiple: true}).trigger('change')
			} catch (e) {
				$('#err').html('<p>更新活動清單失敗，請稍後再試</p>').show()
			} finally {
				$('#myModal').modal('hide')
			}
		}

		//更新log
		const news = `

1. 新增表格及 CSV 下載功能
2. 新增 PT 差異計算（不同活動/同活動）
3. 圖表滑鼠移過時顯示各活動 PT 值

5. 與「同活動不同名次比較」頁面互連
